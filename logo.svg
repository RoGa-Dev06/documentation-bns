  <path d="M195 755 L805 755" stroke="#73572f" stroke-width="3"/>
  <text x="500" y="800" text-anchor="middle" fill="#f1dfb0" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" letter-spacing="8">BEAR</text>
