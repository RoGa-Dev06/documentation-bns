  <path d="M405 470 Q500 505 595 470 L579 502 Q500 540 421 502 Z" fill="url(#gold)" stroke="#382a19" stroke-width="7"/>
  <path d="M500 500 L500 590" stroke="#d5b16b" stroke-width="23"/>
  <path d="M500 500 L500 590" stroke="#382a19" stroke-width="4"/>
  <path d="M500 575 L538 615 L500 655 L462 615 Z" fill="url(#gold)" stroke="#382a19" stroke-width="7"/>

