  <path d="M300 300 Q270 210 330 190 Q390 180 411 258 Q500 220 589 258 Q610 180 670 190 Q730 210 700 300 Q755 390 710 515 Q680 620 585 660 Q500 700 415 660 Q320 620 290 515 Q245 390 300 300 Z" fill="#20272b" stroke="url(#gold)" stroke-width="13"/>
  <path d="M320 287 Q320 225 354 225 Q385 228 388 286" fill="none" stroke="#8f6a39" stroke-width="10"/>
  <path d="M612 286 Q615 228 646 225 Q680 225 680 287" fill="none" stroke="#8f6a39" stroke-width="10"/>

