  <!-- Small ornamental accents -->
  <path d="M145 790 L190 790 M810 790 L855 790" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <path d="M500 890 L520 910 L500 930 L480 910 Z" fill="url(#gold)"/>
