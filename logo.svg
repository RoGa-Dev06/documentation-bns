  <path d="M315 470 L350 492 L326 520 L367 526 L344 560 L393 558 L382 598" fill="none" stroke="#b88b50" stroke-width="9" stroke-linejoin="round"/>
  <path d="M685 470 L650 492 L674 520 L633 526 L656 560 L607 558 L618 598" fill="none" stroke="#b88b50" stroke-width="9" stroke-linejoin="round"/>

