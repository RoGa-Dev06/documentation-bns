  <path d="M635 445 Q595 410 545 440 L523 462 Q570 490 620 478 Z" fill="#d0a45b"/>
  <path d="M390 452 L447 455 M610 452 L553 455" stroke="#111519" stroke-width="12" stroke-linecap="round"/>
  <path d="M500 448 L500 520" stroke="#b98a48" stroke-width="8"/>
  <path d="M430 535 Q500 495 570 535 Q555 605 500 614 Q445 605 430 535 Z" fill="#111519" stroke="#9b743d" stroke-width="8"/>
  <path d="M467 540 Q500 522 533 540 Q526 563 500 566 Q474 563 467 540 Z" fill="#c5a06a"/>
  <path d="M500 566 L500 590 M470 600 Q500 620 530 600" fill="none" stroke="#b88b50" stroke-width="7" stroke-linecap="round"/>

