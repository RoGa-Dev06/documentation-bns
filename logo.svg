<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Bear The Next Sword</title>
  <desc id="desc">Dark fantasy emblem with a stylized bear head, a vertical sword, and the game's title.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6df9b"/>
      <stop offset=".48" stop-color="#c79a4b"/>
      <stop offset="1" stop-color="#805522"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66717b"/>
      <stop offset=".48" stop-color="#f0eee5"/>
      <stop offset="1" stop-color="#68727c"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M500 78 L790 185 L760 525 Q720 720 500 825 Q280 720 240 525 L210 185 Z"/>
    </clipPath>
  </defs>

  <!-- Outer crest -->
  <path d="M500 42 L822 160 L790 540 Q744 765 500 875 Q256 765 210 540 L178 160 Z" fill="#111519" stroke="url(#gold)" stroke-width="16"/>
  <path d="M500 70 L793 176 L765 530 Q722 725 500 829 Q278 725 235 530 L207 176 Z" fill="none" stroke="#6f542e" stroke-width="3"/>
