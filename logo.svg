  <path d="M330 355 Q385 290 466 330 L500 365 L534 330 Q615 290 670 355 L635 405 Q570 370 520 415 L500 432 L480 415 Q430 370 365 405 Z" fill="#0d1114" stroke="#9c783f" stroke-width="7"/>
